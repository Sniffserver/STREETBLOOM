<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a384f" />
      <stop offset="100%" stop-color="#0a0d14" />
    </radialGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b39" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="10 8" />

  <!-- Compass / Road Lines -->
  <path d="M 256 90 L 256 422 M 90 256 L 422 256" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Flower / Bloom Petals (4 cardinal + 4 small diagonal) -->
  <g filter="url(#bloomGlow)">
    <circle cx="256" cy="180" r="54" fill="url(#petalGrad1)" />
    <circle cx="256" cy="332" r="54" fill="url(#petalGrad1)" />
    <circle cx="180" cy="256" r="54" fill="url(#petalGrad1)" />
    <circle cx="332" cy="256" r="54" fill="url(#petalGrad1)" />
    <circle cx="202" cy="202" r="42" fill="#ec4899" fill-opacity="0.8" />
    <circle cx="310" cy="202" r="42" fill="#ec4899" fill-opacity="0.8" />
    <circle cx="202" cy="310" r="42" fill="#ec4899" fill-opacity="0.8" />
    <circle cx="310" cy="310" r="42" fill="#ec4899" fill-opacity="0.8" />
    <!-- Center Creature / Bud -->
    <circle cx="256" cy="256" r="58" fill="url(#coreGrad)" />
    <!-- Creature Eyes & Smile -->
    <ellipse cx="242" cy="250" rx="6" ry="9" fill="#0f172a" />
    <ellipse cx="270" cy="250" rx="6" ry="9" fill="#0f172a" />
    <circle cx="244" cy="247" r="2.5" fill="#ffffff" />
    <circle cx="272" cy="247" r="2.5" fill="#ffffff" />
    <path d="M 248 266 Q 256 274 264 266" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="233" cy="260" r="4" fill="#f43f5e" fill-opacity="0.6" />
    <circle cx="279" cy="260" r="4" fill="#f43f5e" fill-opacity="0.6" />
    <!-- Small Leaf Sprout on Head -->
    <path d="M 256 198 Q 248 180 256 170 Q 266 182 256 198 Z" fill="#22c55e" />
  </g>
</svg>
